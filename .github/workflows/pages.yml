# Custom Actions deploy so the official 10 builds/hour branch-Pages
# soft limit does not apply. See:
# https://docs.github.com/en/pages/getting-started-with-github-pages/github-pages-limits
# Official custom-workflow shape: upload in a build job, deploy in a
# second job with needs: build (same workflow run).
# https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
# Split jobs also avoid the same-job artifact-visibility race:
# https://github.com/actions/deploy-pages/issues/451
# Actions trigger/queue limits are far above one push every 15s:
# https://docs.github.com/en/actions/reference/limits
name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
